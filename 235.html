<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Интерактивті Электроника Модулі</title>
    <style>
        :root {
            --neon-color: #00e5ff; /* Осы жерден түсті өзгертсең, бүкіл сайт өзгереді */
            --bg-deep: #02080a;
        }

        body {
            background-color: var(--bg-deep);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Негізгі Контейнер - Кез келген экранға сыяды */
        .interface-container {
            width: 95vw;
            height: 90vh;
            border: 2px solid var(--neon-color);
            position: relative;
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: 60px 1fr 40px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            background: rgba(0, 10, 15, 0.9);
        }

        /* Жоғарғы жақ (Тақырып орны) */
        .top-bar {
            grid-column: 1 / span 2;
            border-bottom: 1px solid var(--neon-color);
            display: flex;
            align-items: center;
            padding: 0 25px;
            justify-content: space-between;
            background: rgba(0, 229, 255, 0.05);
        }

        .system-status {
            color: var(--neon-color);
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--neon-color);
        }

        /* Сол жақ мәзір (Батырмалар рет-ретімен) */
        .nav-sidebar {
            border-right: 1px solid rgba(0, 229, 255, 0.3);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
        }

        /* Әдемі әрі жұмыс істейтін батырмалар */
        .menu-btn {
            background: transparent;
            border: 1px solid rgba(0, 229, 255, 0.5);
            color: white;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            transition: 0.4s all;
            font-size: 14px;
            text-transform: uppercase;
            position: relative;
        }

        .menu-btn:hover {
            background: var(--neon-color);
            color: black;
            box-shadow: 0 0 20px var(--neon-color);
            font-weight: bold;
            padding-left: 25px;
        }

        /* Орталық Мәзмұн (Мұғалім берген тақырып осында шығады) */
        .main-content {
            padding: 40px;
            overflow-y: auto;
            background-image: radial-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .content-box {
            max-width: 800px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: var(--neon-color); font-size: 2.5rem; margin-bottom: 20px; }
        p { font-size: 1.1rem; line-height: 1.8; color: #b0d4d8; }

        /* Төменгі панель */
        footer {
            grid-column: 1 / span 2;
            border-top: 1px solid rgba(0, 229, 255, 0.3);
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            color: #4a7a7e;
        }

    </style>
</head>
<body>

    <div class="interface-container">
        <header class="top-bar">
            <div class="system-status">● SYSTEM ACTIVE</div>
            <div id="project-title" style="color: white; font-weight: bold;">ЭЛЕКТРОНИКА ОҚУЛЫҒЫ</div>
            <div id="clock">00:00:00</div>
        </header>

        <aside class="nav-sidebar">
            <button class="menu-btn" onclick="loadContent('topic1')">01. Кіріспе</button>
            <button class="menu-btn" onclick="loadContent('topic2')">02. Негізгі бөлім</button>
            <button class="menu-btn" onclick="loadContent('topic3')">03. Тәжірибе</button>
            <button class="menu-btn" onclick="loadContent('topic4')">04. Қорытынды</button>
            <button class="menu-btn" onclick="loadContent('test')">05. Бақылау тесті</button>
        </aside>

        <main class="main-content" id="screen">
            <div class="content-box">
                <h1>Жобаға қош келдіңіз!</h1>
                <p>Мұғалім тақырыпты берген кезде, сол жақтағы батырмалар арқылы тиісті ақпаратты осы жерге шығаруға болады. Дизайн толықтай дайын, тек мәтінді толтыру қажет.</p>
            </div>
        </main>

        <footer>
            CPU LOAD: 14% | TEMP: 38°C | USER: STUDENT_001 | CORE: V8-STABLE
        </footer>
    </div>

    <script>
        // Бұл функция мәтінді мұғалім берген тақырыпқа сай оңай өзгертуге мүмкіндік береді
        function loadContent(topic) {
            const screen = document.getElementById('screen');
            let html = "";

            if(topic === 'topic1') {
                html = `<h1>Кіріспе</h1><p>Бұл жерге мұғалім берген кіріспе мәтінін жазасыз. Дизайн өзгеріссіз қалады, тек мәтін өзгереді.</p>`;
            } else if(topic === 'topic2') {
                html = `<h1>Негізгі бөлім</h1><p>Электрониканың негізгі заңдылықтары мен құрылғылары туралы ақпарат осында болады.</p>`;
            } else if(topic === 'test') {
                html = `<h1>Бақылау тесті</h1><p>Оқушының білімін тексеруге арналған интерактивті сұрақтар блогы.</p>`;
            } else {
                html = `<h1>Жаңа тақырып</h1><p>Мұғалім берген кез келген тақырыпты осы жерге секунд ішінде қоса аламыз.</p>`;
            }

            screen.innerHTML = `<div class="content-box">${html}</div>`;
        }

        // Сағат анимациясы
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);
    </script>
</body>
</html>
